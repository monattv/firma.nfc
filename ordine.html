<!DOCTYPE html>

<html lang="it">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Completa ordine - Firma NFC</title>


<link rel="stylesheet" href="css/style.css">


</head>



<body>



<header class="header">


<div class="logo">

Firma<span>NFC</span>

</div>


</header>





<section class="order-page">


<h1>

Completa il tuo ordine

</h1>




<div id="riepilogo-ordine">


</div>





<form id="form-ordine">


<input

type="text"

id="nome"

placeholder="Nome"

required

>




<input

type="text"

id="cognome"

placeholder="Cognome"

required

>





<input

type="tel"

id="telefono"

placeholder="Telefono / WhatsApp"

required

>





<input

type="text"

id="indirizzo"

placeholder="Indirizzo"

required

>





<input

type="text"

id="cap"

placeholder="CAP"

required

>





<input

type="text"

id="citta"

placeholder="Città"

required

>





<textarea

id="note"

placeholder="Note ordine (facoltative)"

></textarea>






<h3>

Pagamento

</h3>


<div class="pagamento">


<label>

<input

type="radio"

checked

>

Pagamento alla consegna

</label>


</div>







<button

type="submit"

class="main-button"

>

Conferma ordine

</button>




</form>



</section>






<script src="js/ordine.js"></script>


</body>


</html>
