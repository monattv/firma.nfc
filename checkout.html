<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | NFC Store</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="navbar">

<div class="logo">
🌿 NFC STORE
</div>


<a href="cart.html" class="cart">

🛒 Carrello

</a>


</header>






<section class="checkout">


<h1>
Completa il tuo ordine
</h1>





<div class="checkoutGrid">





<div class="card orderBox">


<h2>
Il tuo prodotto
</h2>



<div id="orderPreview">

🔑

</div>



<div id="orderDetails">

</div>



<div class="totalBox">

Totale:

<strong>
€<span id="checkoutTotal">
0
</span>
</strong>

</div>



</div>









<div class="card">


<h2>
Dati consegna
</h2>




<form id="checkoutForm">



<input
type="text"
name="nome"
placeholder="Nome"
required>



<input
type="text"
name="cognome"
placeholder="Cognome"
required>



<input
type="tel"
name="telefono"
placeholder="Telefono"
required>



<input
type="text"
name="indirizzo"
placeholder="Indirizzo"
required>



<input
type="text"
name="citta"
placeholder="Città"
required>



<input
type="text"
name="cap"
placeholder="CAP"
required>






<div class="paymentBox">


<h3>
Metodo di pagamento
</h3>


<div class="paymentActive">


<input
type="radio"
checked
disabled>


💵 Pagamento alla consegna


</div>



<small>

Unico metodo disponibile

</small>


</div>







<textarea
name="note"
placeholder="Note aggiuntive">
</textarea>







<button
class="mainBtn checkoutBtn">

Conferma ordine

</button>




</form>


<p id="message"></p>



</div>




</div>


</section>






<script src="script.js"></script>


</body>

</html>
