<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personalizza | NFC Store</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="navbar">


<div class="logo">
🌿 NFC STORE
</div>


<a href="cart.html" class="cart">

🛒 Carrello

</a>


</header>








<section class="customizer">



<div class="customPreview">


<h1>
Crea il tuo portachiavi
</h1>



<div id="customProduct">

🔑

</div>




<h2 id="previewTitle">

Portachiavi Rotondo Nero

</h2>



<div class="livePrice">

€<span id="price">

19.99

</span>

</div>



</div>








<div class="customPanel">





<div class="card">


<h2>
1. Scegli la forma
</h2>



<div class="options">


<button onclick="setShape('Rotondo')">

⭕
<br>
Rotondo

</button>


<button onclick="setShape('Quadrato')">

⬛
<br>
Quadrato

</button>


<button onclick="setShape('Rettangolare')">

▭
<br>
Rettangolare

</button>


<button onclick="setShape('Esagonale')">

⬡
<br>
Esagonale

</button>


<button onclick="setShape('Personalizzata')">

⭐
<br>
Libera

</button>



</div>


</div>









<div class="card">


<h2>
2. Scegli colore
</h2>



<div class="colorOptions">


<div 
class="circle nero active"
onclick="setColor('Nero','#111')">
</div>



<div 
class="circle verde"
onclick="setColor('Verde','#10b981')">
</div>



<div 
class="circle bianco"
onclick="setColor('Bianco','#eeeeee')">
</div>



<div 
class="circle oro"
onclick="setColor('Oro','#d4af37')">
</div>



<div 
class="circle blu"
onclick="setColor('Blu','#2563eb')">
</div>



</div>


</div>









<div class="card">


<h2>
3. Quantità
</h2>



<div class="quantity">


<button onclick="changeQty(-1)">
-
</button>


<span id="quantity">
1
</span>


<button onclick="changeQty(1)">
+
</button>


</div>


</div>









<div class="card">


<h2>
4. Personalizzazione
</h2>




<textarea
id="description"
placeholder="
Descrivi il tuo portachiavi:

Nome
Logo
Frase
Numero telefono
Idea particolare
">
</textarea>





<label class="upload">


📷 Carica immagine o logo


<input 
type="file"
id="image"
accept="image/*">


</label>



</div>









<div class="card summary">


<h2>
Riepilogo
</h2>



<p id="summary">

Rotondo | Nero | Quantità 1

</p>




<button 
class="mainBtn"
onclick="addCart()">

🛒 Aggiungi al carrello

</button>



</div>






</div>



</section>







<script src="script.js"></script>


</body>

</html>
