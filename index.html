<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portachiavi NFC Personalizzato</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>


<body>


<div class="page">


<header>

<h1>
🔑 Portachiavi NFC Smart
</h1>

<p>
Crea il tuo portachiavi personalizzato
</p>

</header>



<section class="card">


<h2>1. Scegli la forma</h2>


<div class="options">


<div class="option active" data-forma="Rotondo">

⭕
<span>Rotondo</span>

</div>



<div class="option" data-forma="Quadrato">

⬛
<span>Quadrato</span>

</div>



<div class="option" data-forma="Esagonale">

⬡
<span>Esagonale</span>

</div>


</div>


</section>





<section class="card">


<h2>2. Scegli colore</h2>


<div class="colors">


<div class="color black active" data-colore="Nero"></div>

<div class="color white" data-colore="Bianco"></div>

<div class="color blue" data-colore="Blu"></div>

<div class="color red" data-colore="Rosso"></div>

<div class="color gold" data-colore="Oro"></div>


</div>


<p id="coloreScelto">
Nero
</p>


</section>






<section class="card preview">


<h2>Anteprima</h2>


<div id="productPreview">

🔑

</div>


<h3 id="previewText">
Portachiavi Rotondo Nero
</h3>


<strong>
€19,99
</strong>


</section>







<section class="card">


<h2>3. Personalizzazione</h2>


<textarea 
name="personalizzazione"
id="personalizzazione"
placeholder="Descrivi come vuoi il tuo portachiavi...

Esempio:
Logo aziendale
Nome e telefono
Disegno particolare">
</textarea>




<label class="upload">

📷 Inserisci immagine/logo

<input 
type="file"
id="foto"
accept="image/*">

</label>



</section>








<section class="card">


<h2>4. Dati consegna</h2>


<form id="orderForm">


<input 
name="nome"
placeholder="Nome"
required>



<input 
name="cognome"
placeholder="Cognome"
required>



<input 
name="telefono"
placeholder="Telefono"
required>



<input 
name="indirizzo"
placeholder="Indirizzo"
required>




<input 
name="quantita"
id="quantita"
type="number"
value="1"
min="1">



<input 
type="hidden"
name="forma"
id="forma"
value="Rotondo">


<input 
type="hidden"
name="colore"
id="colore"
value="Nero">






<div class="payment">


<h3>
💵 Pagamento
</h3>


<div class="paybox">

<input type="radio" checked disabled>

Pagamento alla consegna 🔒


</div>


</div>






<textarea
name="note"
placeholder="Note aggiuntive">
</textarea>




<button>

🚀 ORDINA ORA

</button>



</form>


<p id="risposta"></p>


</section>



</div>



<script src="script.js"></script>


</body>

</html>
