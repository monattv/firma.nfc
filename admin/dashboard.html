<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Firma NFC Dashboard</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<div class="dashboard-container">


<header class="dashboard-header">


<div class="logo">
Firma<span>NFC</span>
</div>


<h1>
Dashboard Admin
</h1>


<button class="logout" onclick="logout()">
Esci
</button>


</header>





<section class="cards">


<div class="card">

<h2>
📦 Ordini
</h2>

<p>
Gestione ordini clienti
</p>


<button onclick="caricaOrdini()">

Visualizza ordini

</button>


</div>






<div class="card">

<h2>
🛒 Prodotti
</h2>


<p>
Gestione catalogo
</p>


<button onclick="apriProdotti()">

Gestisci prodotti

</button>


</div>



</section>





<section class="ordini-section">


<h2>
Ordini
</h2>


<div id="ordini">

</div>


</section>




</div>





<script src="dashboard.js"></script>



<script>


if(localStorage.getItem("adminLogin") !== "true"){

window.location.href="index.html";

}



function logout(){

localStorage.removeItem("adminLogin");

window.location.href="index.html";

}



function apriProdotti(){

window.location.href="prodotti.html";

}


</script>



</body>

</html>
